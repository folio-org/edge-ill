get:
  tags: [ PatronRequests ]
  description: "View the document associated with the patron request"
  operationId: viewDocument
  parameters:
    - $ref: '../../parameters/path/tenant-id.yaml'
    - $ref: '../../parameters/path/patron-request-id.yaml'
  responses:
    '200':
      description: Successful response - the document is streamed as-is from the backend (mod-ill)
      content:
        '*/*':
          schema:
            type: string
            format: binary
    '400':
      $ref: '../../error-responses/BadRequest.yaml'
    '404':
      $ref: '../../error-responses/NotFound.yaml'
    '500':
      $ref: '../../error-responses/InternalServerError.yaml'
