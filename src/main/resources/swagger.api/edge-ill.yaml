openapi: 3.0.3
info:
  title: Edge ILL FOLIO API
  description: |
    Edge API that proxies external client requests to the FOLIO mod-ill module.
    Endpoints mirror the mod-ill `ill` interface as declared in its module descriptor.
  version: 1.0.0
servers:
  - url: /

paths:

  ### ILL Public Endpoints
  /illService/tenants/{tenantId}/externalApi/directoryEntry:
    $ref: 'paths/external-api/directory-entry.yaml'

  /illService/tenants/{tenantId}/externalApi/iso18626:
    $ref: 'paths/external-api/iso18626.yaml'

  /illService/tenants/{tenantId}/externalApi/statistics:
    $ref: 'paths/external-api/statistics.yaml'

  /illService/tenants/{tenantId}/externalApi/statusReport:
    $ref: 'paths/external-api/status-report.yaml'

  /illService/tenants/{tenantId}/patronrequests/openURL:
    $ref: 'paths/patron-requests/open-url.yaml'

  /illService/tenants/{tenantId}/patronrequests/{patronRequestId}/agreeCopyright:
    $ref: 'paths/patron-requests/agree-copyright.yaml'

  /illService/tenants/{tenantId}/patronrequests/{patronRequestId}/fetchCopyright:
    $ref: 'paths/patron-requests/fetch-copyright.yaml'

  /illService/tenants/{tenantId}/patronrequests/{patronRequestId}/viewDocument:
    $ref: 'paths/patron-requests/view-document.yaml'

  /illService/tenants/{tenantId}/testDocumentDelivery/offer:
    $ref: 'paths/test-document-delivery/offer.yaml'

  /illService/tenants/{tenantId}/testDocumentDelivery/register:
    $ref: 'paths/test-document-delivery/register.yaml'

  /illService/tenants/{tenantId}/remoteAction/{id}/perform:
    $ref: 'paths/remote-action/perform.yaml'
